    <script>
      // Filter benign Vite development notices in sandbox iframe
      (function() {
        const _origErr = console.error;
        console.error = function(...args) {
          if (args && args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket'))) {
            return;
          }
          _origErr.apply(console, args);
        };
        const _origWarn = console.warn;
        console.warn = function(...args) {
          if (args && args[0] && typeof args[0] === 'string' && (args[0].includes('[vite]') || args[0].includes('websocket') || args[0].includes('WebSocket'))) {
            return;
          }
          _origWarn.apply(console, args);
        };
      })();

      // Global safeguard against polyfills or libraries trying to set window.fetch in environments with getter-only fetch
      (function() {
        try {
          const _nativeFetch = window.fetch ? window.fetch.bind(window) : null;
          let _currentFetch = _nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get() {
              return _currentFetch || _nativeFetch;
            },
            set(newFetch) {
              _currentFetch = typeof newFetch === 'function' ? newFetch : _nativeFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot be overridden
        }
      })();
    </script>
