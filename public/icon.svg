<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="ballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner grid pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <line x1="128" y1="40" x2="128" y2="472" />
    <line x1="256" y1="40" x2="256" y2="472" />
    <line x1="384" y1="40" x2="384" y2="472" />
    <line x1="40" y1="128" x2="472" y2="128" />
    <line x1="40" y1="256" x2="472" y2="256" />
    <line x1="40" y1="384" x2="472" y2="384" />
  </g>

  <!-- Golden Ring -->
  <circle cx="256" cy="246" r="150" fill="none" stroke="url(#goldGrad)" stroke-width="12" opacity="0.85" filter="url(#shadow)" />

  <!-- Bingo Ball -->
  <circle cx="256" cy="246" r="136" fill="url(#ballGrad)" filter="url(#shadow)" />

  <!-- Inner Color Ring -->
  <circle cx="256" cy="246" r="92" fill="#047857" />

  <!-- Center Ball Letter / Number -->
  <text x="256" y="274" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="94" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">B</text>

  <!-- Top Accent Stars -->
  <polygon points="256,76 262,94 280,94 266,104 271,122 256,112 241,122 246,104 232,94 250,94" fill="#fbbf24" />
  <polygon points="186,100 190,114 204,114 193,122 197,136 186,128 175,136 179,122 168,114 182,114" fill="#fbbf24" opacity="0.85" />
  <polygon points="326,100 330,114 344,114 333,122 337,136 326,128 315,136 319,122 308,114 322,114" fill="#fbbf24" opacity="0.85" />

  <!-- Bottom Brand Text -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">BINGO 75</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">OFFLINE EDITION</text>
</svg>
